<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burçin Süer · 3D CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05080f; --ink:#e6f1ff; --mute:#8aa0b8; --dim:#4b5d73;
    --cyan:#3ee6ff; --violet:#9b8cff; --green:#3dffa8; --amber:#ffc65c; --pink:#ff6fae;
    --glass:rgba(10,18,32,.72); --line:rgba(62,230,255,.18);
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:'Inter',system-ui,sans-serif;
    --panelW:min(440px,92vw);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas#c.pointer{cursor:pointer}
  canvas#c:active{cursor:grabbing}
  a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}

  /* scanline + vignette */
  .fx{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);}

  /* top HUD */
  .hud{position:fixed;top:22px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:16px}
  .id{pointer-events:auto}
  .id .tag{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--cyan);opacity:.85;text-transform:uppercase}
  .id h1{margin:6px 0 4px;font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.02em;
    background:linear-gradient(90deg,#fff 0%,#bfefff 60%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .id .typed{font-family:var(--mono);font-size:13px;color:var(--mute);min-height:1.4em}
  .id .typed b{color:var(--green);font-weight:500}
  .caret{display:inline-block;width:7px;height:14px;background:var(--cyan);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .status{pointer-events:auto;font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right;line-height:1.9;
    background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:10px 14px;backdrop-filter:blur(8px)}
  .status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);margin-right:6px;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .status a{color:var(--ink)}

  /* bottom nav */
  nav{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
    background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:6px;backdrop-filter:blur(10px);width:max-content;max-width:calc(100vw - 24px);transition:opacity .3s,left .5s}
  body.panel-open nav{left:calc((100vw - var(--panelW))/2)}
  nav button{font-family:var(--mono);font-size:12px;color:var(--mute);background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 11px;cursor:pointer;transition:.2s}
  nav button:hover{color:var(--ink);background:rgba(62,230,255,.08)}
  nav button.on{color:var(--bg);background:var(--cyan);font-weight:700}
  nav button .n{opacity:.55;margin-right:5px}
  body.panel-open .hint{opacity:0}
  .hint{transition:opacity .3s;position:fixed;left:26px;bottom:30px;font-family:var(--mono);font-size:11px;color:var(--dim);pointer-events:none}

  /* panel */
  aside#panel{position:fixed;top:0;right:0;height:100%;width:var(--panelW);background:linear-gradient(180deg,rgba(8,14,26,.92),rgba(5,9,18,.95));
    border-left:1px solid var(--line);backdrop-filter:blur(14px);transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;z-index:5}
  aside#panel.open{transform:none}
  .ph{padding:22px 24px 14px;border-bottom:1px solid var(--line);position:relative}
  .ph .addr{font-family:var(--mono);font-size:11px;color:var(--accent,var(--cyan));letter-spacing:.12em}
  .ph h2{margin:6px 0 0;font-size:24px;letter-spacing:-.01em}
  .ph .x{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:18px;cursor:pointer}
  .ph .x:hover{color:var(--ink);border-color:var(--cyan)}
  .pb{flex:1;overflow-y:auto;padding:18px 24px 28px;font-size:14px;line-height:1.6;color:#cfdbe8}
  .pb::-webkit-scrollbar{width:6px}.pb::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .pf{display:flex;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line)}
  .pf button{font-family:var(--mono);font-size:12px;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
  .pf button:hover{color:var(--ink);border-color:var(--cyan)}

  /* content blocks */
  .lead{font-size:15px;color:var(--ink)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
  .stat{border:1px solid var(--line);border-radius:10px;padding:12px;background:rgba(62,230,255,.03)}
  .stat b{display:block;font-family:var(--mono);font-size:22px;color:var(--accent,var(--cyan))}
  .stat span{font-size:12px;color:var(--mute)}
  .role{position:relative;padding:0 0 18px 20px;border-left:1px dashed var(--line);margin-left:6px}
  .role:last-child{border-left-color:transparent}
  .role::before{content:"";position:absolute;left:-6px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--accent,var(--cyan));box-shadow:0 0 10px var(--accent,var(--cyan))}
  .role.now::before{background:var(--green);border-color:var(--green);box-shadow:0 0 12px var(--green)}
  .role h3{margin:0;font-size:15px;color:var(--ink)}
  .role .org{font-size:13px;color:var(--accent,var(--cyan));font-weight:500}
  .role .meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin:2px 0 8px}
  ul.b{margin:0;padding-left:16px} ul.b li{margin:4px 0} ul.b li::marker{color:var(--accent,var(--cyan))}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
  .chip{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);color:#bfe9f5;background:rgba(62,230,255,.05)}
  h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:20px 0 6px}
  h4:first-child{margin-top:4px}
  .cert{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .cert .ic{flex:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--bg);background:var(--accent,var(--cyan))}
  .cert.prog .ic{background:transparent;color:var(--amber);border:1px dashed var(--amber)}
  .cert b{display:block;color:var(--ink);font-weight:600;font-size:14px}
  .cert small{color:var(--mute);font-size:12px}
  .badge{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
  .badge.g{background:rgba(61,255,168,.14);color:var(--green)} .badge.a{background:rgba(255,198,92,.14);color:var(--amber)}
  .talk{border:1px solid var(--line);border-radius:12px;padding:16px;background:linear-gradient(135deg,rgba(155,140,255,.08),rgba(62,230,255,.04))}
  .talk q{display:block;font-size:17px;font-weight:600;color:var(--ink);quotes:"“" "”";line-height:1.4}
  .talk .where{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:8px}
  .lang{display:grid;grid-template-columns:80px 1fr 34px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
  .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent,var(--cyan)),#fff);border-radius:3px;width:0;transition:width 1s .2s}
  aside.open .bar i{width:var(--w)}
  .lang code{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:right}
  .contact{display:grid;gap:6px;font-family:var(--mono);font-size:12px;margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:10px}
  .contact span{color:var(--dim)}

  /* loader */
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10;transition:opacity .8s}
  #boot pre{font-family:var(--mono);font-size:12px;color:var(--cyan);line-height:1.8;margin:0;min-width:300px}
  #boot.hide{opacity:0;pointer-events:none}

  /* fallback (no WebGL) */
  #fallback{display:none;position:fixed;inset:0;overflow:auto;padding:40px 20px;z-index:4}
  body.nogl #fallback{display:block} body.nogl canvas,body.nogl nav,body.nogl .hint,body.nogl aside{display:none}
  #fallback section{max-width:680px;margin:0 auto 30px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:22px}
  #fallback h2{margin-top:0}

  @media (max-width:760px){
    .hud{top:14px;left:14px;right:14px}
    .status{display:none}
    .hint{display:none}
    nav{bottom:12px;gap:2px;padding:4px}
    nav button{padding:7px 8px;font-size:11px} nav button .n{display:none}
    aside#panel{top:auto;bottom:0;width:100%;height:62%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}
    aside#panel.open{transform:none}
    body.panel-open nav{opacity:0;pointer-events:none;left:50%}
  }
  @media (prefers-reduced-motion:reduce){ .caret,.status .dot{animation:none} }

  /* ===== nav labs ===== */
  nav .sep{width:1px;background:var(--line);margin:4px 4px}
  nav button.lab{color:#ffc65c}
  nav button.lab.on{background:#ffc65c;color:var(--bg)}
  .launch{margin-top:18px;width:100%;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.06em;padding:14px;border-radius:10px;border:0;cursor:pointer;
    background:var(--accent,var(--cyan));color:var(--bg);box-shadow:0 0 24px color-mix(in srgb,var(--accent,#3ee6ff) 45%,transparent);transition:transform .15s}
  .launch:hover{transform:translateY(-2px)}
  .labfeat{display:grid;gap:8px;margin:14px 0}
  .labfeat div{display:flex;gap:10px;font-size:13.5px}
  .labfeat b{font-family:var(--mono);color:var(--accent,var(--cyan));flex:none;width:18px}

  /* ===== lab overlay ===== */
  #lab{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:rgba(3,6,12,.96);backdrop-filter:blur(8px)}
  #lab.open{display:flex;animation:labin .35s ease-out}
  @keyframes labin{from{opacity:0;transform:scale(.985)}}
  .lab-h{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex:none}
  .lab-h h3{margin:0;font-size:16px;font-family:var(--mono);letter-spacing:.02em}
  .lab-h .tagd{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#ffc65c;border:1px solid rgba(255,198,92,.4);padding:3px 7px;border-radius:5px}
  .lab-h .sp{flex:1}
  .lab-h button{font-family:var(--mono);font-size:12px;background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
  .lab-h button:hover{color:var(--ink);border-color:var(--cyan)}
  .lab-b{flex:1;min-height:0;overflow:auto}

  /* ===== SOC simulator ===== */
  .soc{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:560px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
  .kpi{padding:12px 18px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0}
  .kpi span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
  .kpi b{font-family:var(--mono);font-size:24px;color:var(--ink)}
  .kpi b.c{color:var(--cyan)} .kpi b.g{color:var(--green)} .kpi b.a{color:#ffc65c}
  .socg{display:grid;grid-template-columns:320px 1fr 440px;min-height:0}
  .queue{border-right:1px solid var(--line);overflow:auto}
  .qh{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--mute);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;position:sticky;top:0;background:#060a12;z-index:1}
  .qh i{font-style:normal;color:var(--green)}
  .al{padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;display:grid;grid-template-columns:10px 1fr auto;gap:4px 10px;align-items:start;animation:slidein .4s ease-out}
  @keyframes slidein{from{opacity:0;transform:translateX(-12px);background:rgba(62,230,255,.12)}}
  .al:hover{background:rgba(62,230,255,.04)} .al.sel{background:rgba(62,230,255,.08);box-shadow:inset 3px 0 0 var(--cyan)}
  .al .d{width:9px;height:9px;border-radius:50%;margin-top:5px}
  .al .t{font-size:13px;color:var(--ink);font-weight:500;line-height:1.35}
  .al .e{grid-column:2;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
  .al .s{font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.06);color:var(--mute);white-space:nowrap}
  .al.done{opacity:.45}
  .s.new{background:rgba(255,111,174,.15);color:#ff8fc0}
  .sev-critical{background:#ff3d5a;box-shadow:0 0 10px #ff3d5a} .sev-high{background:#ff8a3d;box-shadow:0 0 8px #ff8a3d}
  .sev-medium{background:#ffc65c} .sev-low{background:#3ee6ff}
  .mapw{position:relative;min-height:300px;overflow:hidden}
  .mapw canvas{position:absolute;inset:0;width:100%;height:100%}
  .maplbl{position:absolute;left:16px;top:12px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--mute)}
  .feed{position:absolute;left:16px;bottom:12px;right:16px;font-family:var(--mono);font-size:11px;color:var(--green);opacity:.85;line-height:1.6;max-height:70px;overflow:hidden}
  .detail{border-left:1px solid var(--line);overflow:auto;padding:18px 20px 24px}
  .detail .empty{color:var(--mute);font-family:var(--mono);font-size:12px;margin-top:40px;text-align:center}
  .dsev{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
  .detail h4.t{font-size:18px;margin:8px 0 4px;color:var(--ink);font-family:var(--sans);letter-spacing:-.01em;text-transform:none}
  .mitre{font-family:var(--mono);font-size:11px;color:#9b8cff}
  .facts{display:grid;grid-template-columns:90px 1fr;gap:5px 10px;font-size:12.5px;margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:10px}
  .facts span{font-family:var(--mono);font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
  .kql{position:relative;background:#02050a;border:1px solid var(--line);border-radius:10px;padding:12px 12px 12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.65;color:#cfe8f3;white-space:pre;overflow:auto;margin:6px 0 14px}
  .kql .k{color:#ff8fc0}.kql .f{color:#9b8cff}.kql .s{color:#3dffa8}.kql .n{color:#ffc65c}.kql .c{color:#4b5d73}
  .copy{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10px;background:rgba(62,230,255,.1);color:var(--cyan);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
  .pb-steps{counter-reset:s;margin:6px 0 16px;padding:0;list-style:none}
  .pb-steps li{counter-increment:s;position:relative;padding-left:28px;margin:7px 0;font-size:13px}
  .pb-steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;border:1px solid var(--cyan);color:var(--cyan);font-family:var(--mono);font-size:10px;display:grid;place-items:center}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .acts button{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:11px 6px;border-radius:9px;cursor:pointer;border:1px solid;background:transparent;transition:.15s}
  .acts .contain{color:#ff6f8a;border-color:rgba(255,111,138,.5)} .acts .contain:hover{background:#ff6f8a;color:#000}
  .acts .escalate{color:#ffc65c;border-color:rgba(255,198,92,.5)} .acts .escalate:hover{background:#ffc65c;color:#000}
  .acts .close{color:var(--cyan);border-color:var(--line)} .acts .close:hover{background:var(--cyan);color:#000}
  .acts button:disabled{opacity:.35;pointer-events:none}
  .verdict{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}
  .verdict.ok{background:rgba(61,255,168,.08);border:1px solid rgba(61,255,168,.35)}
  .verdict.meh{background:rgba(255,198,92,.08);border:1px solid rgba(255,198,92,.35)}
  .verdict b{font-family:var(--mono)}
  .sub{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;margin-top:16px}

  /* ===== Phish game ===== */
  .phish{max-width:860px;margin:0 auto;padding:22px 20px 40px}
  .ph-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;color:var(--mute);margin-bottom:14px}
  .ph-top .prog{display:flex;gap:5px}.ph-top .prog i{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.1)}
  .ph-top .prog i.ok{background:var(--green)}.ph-top .prog i.no{background:#ff3d5a}.ph-top .prog i.cur{background:var(--cyan)}
  .mail{background:#f6f7f9;color:#1d2330;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
  .mail .mh{padding:18px 22px 14px;border-bottom:1px solid #e3e6ec}
  .mail .subj{font-size:19px;font-weight:600;margin-bottom:10px;font-family:var(--sans)}
  .mail .from{display:flex;gap:12px;align-items:center;font-size:13px}
  .mail .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
  .mail .from small{color:#6b7385;display:block;font-size:12px}
  .mail .when{margin-left:auto;color:#8a92a3;font-size:12px;white-space:nowrap}
  .mail .mb{padding:20px 22px 26px;font-size:14.5px;line-height:1.65;font-family:var(--sans)}
  .mail .mb p{margin:0 0 12px}
  .mail a.ml{color:#1a5fd0;text-decoration:underline;cursor:pointer}
  .mail .btnm{display:inline-block;background:#1a5fd0;color:#fff;padding:10px 18px;border-radius:6px;font-weight:600;text-decoration:none;cursor:pointer}
  .mail .att{display:inline-flex;gap:8px;align-items:center;border:1px solid #d5d9e1;border-radius:8px;padding:8px 12px;font-size:13px;background:#fff}
  .mail .status{position:absolute;left:0;bottom:0;background:#e8ebf0;color:#3a4252;font-family:var(--mono);font-size:11px;padding:4px 10px;border-top-right-radius:6px;opacity:0;transition:opacity .15s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mail .status.on{opacity:1}
  .qr{display:inline-grid;grid-template-columns:repeat(21,6px);gap:0;padding:8px;background:#fff;border:1px solid #d5d9e1}
  .qr i{width:6px;height:6px}.qr i.b{background:#111}
  .flag{position:relative;transition:.3s}
  .revealed .flag{outline:2px solid #ff3d5a;outline-offset:3px;border-radius:3px;background:rgba(255,61,90,.08)}
  .revealed .flag::after{content:attr(data-n);position:absolute;top:-11px;right:-11px;width:20px;height:20px;border-radius:50%;background:#ff3d5a;color:#fff;font:700 11px/20px var(--mono);text-align:center}
  .revealed.legit .flag{outline-color:#16b67a;background:rgba(22,182,122,.08)} .revealed.legit .flag::after{background:#16b67a}
  .ph-act{display:flex;gap:12px;margin-top:18px}
  .ph-act button{flex:1;font-family:var(--mono);font-size:15px;font-weight:700;padding:16px;border-radius:12px;cursor:pointer;border:1px solid}

/* ---- KQL highlighter ---- */
const KQL_OPS = 'where|project|extend|summarize|join|kind|on|by|let|sort|asc|desc|and|or|in|has_any|has|inner|leftanti|top|take|distinct';
const KQL_FN  = 'count|dcount|make_set|bin|ago|prev|datetime_diff|geo_distance_2points|toreal|tostring|isnotempty|_GetWatchlist|dynamic|now';
function hl(src){
  const re = new RegExp(`(\\/\\/.*$)|("[^"\\n]*"|'[^'\\n]*')|\\b(${KQL_OPS})\\b|\\b(${KQL_FN})\\b|\\b(\\d+(?:\\.\\d+)?)\\b`, 'gm');
  let out='', last=0, m;
  while((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    const cls = m[1]?'c':m[2]?'s':m[3]?'k':m[4]?'f':'n';
    out += `<span class="${cls}">${esc(m[0])}</span>`; last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

      <div class="kpi"><span>Accuracy</span><b id="kAcc">–</b></div>
    </div>
    <div class="socg">
      <div class="queue"><div class="qh">ALERT QUEUE <i>● LIVE</i></div><div id="qList"></div></div>
      <div class="mapw"><canvas id="map"></canvas><div class="maplbl">THREAT MAP · INBOUND → SOC MALTA</div><div class="feed" id="feed"></div></div>
      <div class="detail" id="det"><div class="empty">select an alert to triage →</div></div>
    </div></div>`;

  const alerts=[]; let sel=null, done=0, score=0, correct=0, ttSum=0, seq=1040;
  const timers=[]; let raf=0, alive=true;
  const feedEl=$('#feed'), feedLines=[];
  const feed = t => { const ts=new Date().toTimeString().slice(0,8); feedLines.unshift(`${ts}  ${t}`); feedLines.length=Math.min(feedLines.length,4); feedEl.innerHTML=feedLines.map(esc).join('<br>'); };

  /* map */
  const cv=$('#map'), g=cv.getContext('2d'); let W=0,H=0,cell=0,ox=0,oy=0, base=null; const MW=96, MH=40;
  function proj(lon,lat){ const i=(lon+180)/(360/(MW-1)), j=(78-lat)/(134/(MH-1)); return {x:ox+i*cell+cell/2, y:oy+j*cell+cell/2}; }
  function sizeMap(){
    const r=cv.getBoundingClientRect(), dpr=Math.min(devicePixelRatio,2); W=r.width; H=r.height;
    cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
    cell=Math.min(W/MW,(H-40)/MH); ox=(W-cell*MW)/2; oy=(H-cell*MH)/2+6;
    base=document.createElement('canvas'); base.width=cv.width; base.height=cv.height; const b=base.getContext('2d'); b.setTransform(dpr,0,0,dpr,0,0);
    for(let j=0;j<MH;j++) for(let i=0;i<MW;i++){ if(LAND[j*MW+i]!=='1') continue;
      b.fillStyle='rgba(62,230,255,.32)'; b.beginPath(); b.arc(ox+i*cell+cell/2, oy+j*cell+cell/2, Math.max(.8,cell*.2), 0, 7); b.fill(); }
  }
  const ro=new ResizeObserver(sizeMap); ro.observe(cv); sizeMap();
  const arcs=[], ripples=[];
  function launch(o,col,strong){ if(!o) { ripples.push({r:0,a:1,col}); return; }
    arcs.push({o,col,t:0,sp:strong?.55:.4+Math.random()*.3,w:strong?2.2:1,strong}); }
  function bez(a,c,b,t){ const u=1-t; return {x:u*u*a.x+2*u*t*c.x+t*t*b.x, y:u*u*a.y+2*u*t*c.y+t*t*b.y}; }
  let lastT=performance.now();
  function draw(now){
    if(!alive) return; const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
    g.clearRect(0,0,W,H); if(base) g.drawImage(base,0,0,W,H);
    const hq=proj(HQ.lon,HQ.lat);
    for(let k=arcs.length-1;k>=0;k--){ const A=arcs[k]; A.t+=dt*A.sp;
      const a=proj(A.o.lon,A.o.lat), d=Math.hypot(hq.x-a.x,hq.y-a.y), c={x:(a.x+hq.x)/2, y:(a.y+hq.y)/2-d*.38};
      const t1=Math.min(1,A.t), t0=Math.max(0,t1-.35);
      g.strokeStyle=A.col; g.globalAlpha=A.strong?.18:.08; g.lineWidth=1; g.beginPath(); g.moveTo(a.x,a.y); g.quadraticCurveTo(c.x,c.y,hq.x,hq.y); g.stroke();
      for(let s=0;s<14;s++){ const p0=bez(a,c,hq,t0+(t1-t0)*s/14), p1=bez(a,c,hq,t0+(t1-t0)*(s+1)/14);
        g.globalAlpha=(s/14)*(A.strong?1:.6); g.lineWidth=A.w; g.beginPath(); g.moveTo(p0.x,p0.y); g.lineTo(p1.x,p1.y); g.stroke(); }
      const h=bez(a,c,hq,t1); g.globalAlpha=1; g.fillStyle=A.col; g.beginPath(); g.arc(h.x,h.y,A.strong?3:1.8,0,7); g.fill();
      if(A.strong){ g.globalAlpha=.9; g.beginPath(); g.arc(a.x,a.y,2.5,0,7); g.fill(); }
      if(A.t>=1){ arcs.splice(k,1); ripples.push({r:0,a:1,col:A.col,big:A.strong}); }
    }
    for(let k=ripples.length-1;k>=0;k--){ const R=ripples[k]; R.r+=dt*(R.big?60:30); R.a-=dt*(R.big?.9:1.4);
      if(R.a<=0){ripples.splice(k,1);continue;} g.globalAlpha=R.a; g.strokeStyle=R.col; g.lineWidth=1.5; g.beginPath(); g.arc(hq.x,hq.y,R.r,0,7); g.stroke(); }
    g.globalAlpha=1; const pul=1+Math.sin(now/300)*.25;
    g.fillStyle='rgba(61,255,168,.18)'; g.beginPath(); g.arc(hq.x,hq.y,9*pul,0,7); g.fill();
    g.fillStyle='#3dffa8'; g.beginPath(); g.arc(hq.x,hq.y,3.5,0,7); g.fill();
    g.font='600 10px "JetBrains Mono", monospace'; g.fillText('SOC · MALTA', hq.x+10, hq.y-8);
    raf=requestAnimationFrame(draw);
  }
  raf=requestAnimationFrame(draw);

  /* background noise: blocked traffic */
  (function noise(){ if(!alive) return; const o=rnd(ORIGINS); launch(o,'#3ee6ff',false);
    if(Math.random()<.35) feed(`blocked  ${extIP()} → fw-edge-01:${rnd([22,443,3389,445,8080])}  (${o.n})`);
    timers.push(setTimeout(noise, 700+Math.random()*1200)); })();

  /* alerts */
  const qList=$('#qList');
  function kpis(){
    $('#kOpen').textContent=alerts.filter(a=>a.status==='new').length; $('#kDone').textContent=done;
    $('#kMtt').textContent=done?Math.round(ttSum/done)+'s':'–'; $('#kScore').textContent=score;
    $('#kAcc').textContent=done?Math.round(correct/done*100)+'%':'–';
  }
  function renderQ(){
    qList.innerHTML = alerts.map(a=>`<div class="al ${a.status!=='new'?'done':''} ${sel===a?'sel':''}" data-id="${a.id}">
      <span class="d sev-${a.sc.sev}"></span><span class="t">${esc(a.sc.title)}</span>
      <span class="s ${a.status==='new'?'new':''}">${a.status==='new'?'NEW':a.status.toUpperCase()}</span>
      <span class="e">#${a.id} · ${esc(a.d.entity)}</span></div>`).join('');
  }
  qList.onclick = e => { const el=e.target.closest('.al'); if(!el) return; sel=alerts.find(a=>a.id==el.dataset.id); renderQ(); renderD(); };
  function spawn(){
    let sc = rnd(SCEN); while(alerts[0] && sc===alerts[0].sc) sc = rnd(SCEN); const d = sc.make(); const a={id:seq++, sc, d, born:performance.now(), status:'new'};
    alerts.unshift(a); if(alerts.length>14) alerts.pop();
    launch(d.origin, SEV_COL[sc.sev], true);
    feed(`[ALERT] ${sc.sev.toUpperCase()} · ${sc.title} · ${d.entity}`);
    if(!sel) sel=a; renderQ(); if(sel===a) renderD(); kpis();
  }
  function renderD(){
    const det=$('#det'); if(!sel){ det.innerHTML='<div class="empty">select an alert to triage →</div>'; return; }
    const a=sel, sc=a.sc, col=SEV_COL[sc.sev];
    det.innerHTML = `<div class="dsev" style="color:${col}"><span class="d sev-${sc.sev}" style="width:9px;height:9px;border-radius:50%;display:inline-block"></span>${sc.sev} · incident #${a.id}</div>
      <h4 class="t">${esc(sc.title)}</h4><div class="mitre">${esc(sc.mitre)}</div>
      <div class="facts">${Object.entries(a.d.facts).map(([k,v])=>`<span>${esc(k)}</span><div>${esc(v)}</div>`).join('')}</div>
      <div class="sub">Detection · KQL (Sentinel / Defender XDR)</div>
      <div class="kql"><button class="copy">copy</button>${hl(sc.kql(a.d))}</div>
      <div class="sub">Runbook</div>
      <ol class="pb-steps">${sc.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      <div class="sub" style="margin-bottom:8px">Your call</div>
      <div class="acts"><button class="contain" data-act="contain">⛔ Contain</button><button class="escalate" data-act="escalate">⬆ Escalate</button><button class="close" data-act="close">✓ Close (FP/benign)</button></div>
      <div id="verd">${a.verdict||''}</div>`;
    det.querySelector('.copy').onclick = ev => { navigator.clipboard?.writeText(sc.kql(a.d)).then(()=>ev.target.textContent='copied ✓').catch(()=>ev.target.textContent='select & copy'); };
    det.querySelectorAll('[data-act]').forEach(b=>{ b.disabled = a.status!=='new'; b.onclick=()=>act(a,b.dataset.act); });
  }
  const ACT_NAME={contain:'Contain',escalate:'Escalate',close:'Close'};
  function act(a,k){
    const tt=(performance.now()-a.born)/1000; ttSum+=tt; done++;
    const ok = k===a.sc.best; if(ok) correct++;
    const speed = Math.max(0, 60-Math.round(tt));
    score += ok ? 100+speed : 30;
    a.status = {contain:'contained',escalate:'escalated',close:'closed'}[k];
    a.verdict = `<div class="verdict ${ok?'ok':'meh'}"><b>${ok?`✓ Good call  +${100+speed}`:`△ Best move: ${ACT_NAME[a.sc.best]}  +30`}</b><br>${esc(a.sc.why)}</div>`;
    feed(`[${a.status.toUpperCase()}] #${a.id} by analyst in ${Math.round(tt)}s`);
    const next = alerts.find(x=>x.status==='new' && x!==a);
    renderQ(); renderD(); kpis();
    if(next) timers.push(setTimeout(()=>{ if(alive && sel===a){ sel=next; renderQ(); renderD(); } }, 2600));
  }
  spawn(); timers.push(setTimeout(spawn,1200)); timers.push(setTimeout(spawn,2600));
  (function loop(){ if(!alive) return; if(alerts.filter(a=>a.status==='new').length<7) spawn(); timers.push(setTimeout(loop, 6000+Math.random()*5000)); })();
  return () => { alive=false; cancelAnimationFrame(raf); timers.forEach(clearTimeout); ro.disconnect(); };
}};

function qrHTML(){
  const N=21, on=(x,y)=>{ const f=(a,b)=>x>=a&&x<a+7&&y>=b&&y<b+7; for(const [a,b] of [[0,0],[14,0],[0,14]]) if(f(a,b)){ const dx=x-a,dy=y-b; return dx===0||dx===6||dy===0||dy===6||(dx>1&&dx<5&&dy>1&&dy<5);} return Math.random()<.48; };
  let s=''; for(let y=0;y<N;y++) for(let x=0;x<N;x++) s+=`<i class="${on(x,y)?'b':''}"></i>`; return `<div class="qr">${s}</div>`;
}

  function form(){
    root.innerHTML=`<div class="dora"><p class="intro">15 questions across DORA's five pillars, about 3 minutes. Answer for your organisation and get a readiness radar plus your top gaps.</p>
      ${DORA.map((p,pi)=>`<div class="pil"><h4>${pi+1}. ${p.p}</h4><div class="art">${p.art}</div>
        ${p.q.map((q,qi)=>`<div class="qq"><p>${q[0]}</p><div class="opts" data-p="${pi}" data-q="${qi}">${LV.map((l,v)=>`<button data-v="${v}" class="${ans[pi][qi]===v?'on':''}">${l}</button>`).join('')}</div></div>`).join('')}</div>`).join('')}
      <button class="go" id="go" disabled>Answer all 15 to see results</button></div>`;
    const go=$('#go');
    const upd=()=>{ const n=ans.flat().filter(v=>v!==null).length; go.disabled=n<15; go.textContent=n<15?`Answer all 15 to see results (${n}/15)`:'▶ Generate readiness report'; };
    root.querySelectorAll('.opts').forEach(o=>o.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; ans[o.dataset.p][o.dataset.q]=+b.dataset.v; o.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); upd(); });
    go.onclick=result; upd();
  }
  function radar(vals){
    const cx=180,cy=170,R=120,n=vals.length, pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];};
    let s=`<svg viewBox="0 0 360 340">`;
    [.25,.5,.75,1].forEach(f=>{ s+=`<polygon points="${vals.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="rgba(62,230,255,${f===1?.35:.14})"/>`; });
    vals.forEach((_,i)=>{ const [x,y]=pt(i,R); s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(62,230,255,.14)"/>`;
      const [lx,ly]=pt(i,R+26); s+=`<text x="${lx}" y="${ly}" fill="#8aa0b8" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle">${DORA[i].s}</text>`; });
    s+=`<polygon points="${vals.map((v,i)=>pt(i,R*Math.max(.03,v)).join(',')).join(' ')}" fill="rgba(62,230,255,.22)" stroke="#3ee6ff" stroke-width="2"/>`;
    vals.forEach((v,i)=>{ const [x,y]=pt(i,R*Math.max(.03,v)); s+=`<circle cx="${x}" cy="${y}" r="4" fill="#3ee6ff"/>`; });
    return s+'</svg>';
  }
  function result(){
    const pv=ans.map(a=>a.reduce((x,y)=>x+y,0)/9), all=Math.round(pv.reduce((a,b)=>a+b,0)/5*100);
    const [band,bc]= all>=90?['WELL ALIGNED','#3dffa8']:all>=70?['ADVANCED','#3ee6ff']:all>=40?['IN PROGRESS','#ffc65c']:['EARLY STAGE','#ff3d5a'];
    const gaps=[]; ans.forEach((a,pi)=>a.forEach((v,qi)=>{ if(v<3) gaps.push({v,pi,qi}); })); gaps.sort((a,b)=>a.v-b.v || a.pi-b.pi);
    const col=v=>v>=.9?'#3dffa8':v>=.7?'#3ee6ff':v>=.4?'#ffc65c':'#ff3d5a';
    root.innerHTML=`<div class="dora"><div class="dres"><div>${radar(pv)}</div><div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute)">OVERALL READINESS</div>
      <div class="overall" style="color:${bc}">${all}%</div><span class="band" style="background:${bc}22;color:${bc}">${band}</span>
      ${DORA.map((p,i)=>`<div class="pbar"><span>${p.s}</span><div class="bar"><i style="width:${Math.round(pv[i]*100)}%;background:${col(pv[i])}"></i></div><code>${Math.round(pv[i]*100)}%</code></div>`).join('')}
      </div></div>
      <div class="pil" style="margin-top:22px"><h4>${gaps.length?'Top priorities':'No open gaps 🎉'}</h4>
        <ol class="gaps">${gaps.slice(0,4).map(g=>`<li><b>${DORA[g.pi].s}</b> <span style="font-family:var(--mono);font-size:10.5px;color:var(--mute)">(${LV[g.v]})</span><br>${DORA[g.pi].q[g.qi][1]}</li>`).join('')}</ol></div>
      <button class="go" id="redo" style="background:transparent;color:var(--cyan);border:1px solid var(--line)">↺ adjust answers</button>
      <p class="disc">Indicative self-assessment based on Regulation (EU) 2022/2554 (DORA). Not legal advice or a certification. A full gap analysis maps every requirement, including RTS/ITS, to evidence.</p></div>`;
    $('#redo').onclick=()=>{form();root.scrollTop=0;}; root.scrollTop=0;
  }
  form();
}};

      <button class="go" id="ast">▶ start audit</button></div>`;

  }
  render();

function glowTexture(){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.2,'rgba(255,255,255,.55)');
  r.addColorStop(.5,'rgba(255,255,255,.12)'); r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
function labelSprite(text, color, sub){
  const c = document.createElement('canvas'); c.width=512; c.height=160;
  const g = c.getContext('2d');
  g.font = '700 54px "JetBrains Mono", monospace'; g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor = color; g.shadowBlur = 18; g.fillStyle = '#ffffff';
  g.fillText(text, 256, 62);
  if(sub){ g.shadowBlur=0; g.font='500 26px "JetBrains Mono", monospace'; g.fillStyle=color; g.fillText(sub,256,122); }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  const m = new THREE.SpriteMaterial({map:t, transparent:true, depthWrite:false, opacity:.85});
  const s = new THREE.Sprite(m); s.scale.set(2.6, .81, 1); return s;
}

function init3D(){
  const canvas = $('#c');
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas, antialias:true}); }
  catch(e){ document.body.classList.add('nogl'); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05080f);
  scene.fog = new THREE.FogExp2(0x05080f, 0.028);

  const camera = new THREE.PerspectiveCamera(55, 1, .1, 300);
  const HOME = new THREE.Vector3(0, 4.6, 20);
  camera.position.set(0, 14, 48);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = .07;
  controls.enablePan = false; controls.minDistance = 5; controls.maxDistance = 38;
  controls.rotateSpeed = .6;

  const GLOW = glowTexture();
  const additive = (color, opacity=1) => new THREE.SpriteMaterial({map:GLOW, color, transparent:true, opacity, depthWrite:false, blending:THREE.AdditiveBlending});

  /* starfield */
  {
    const n=1800, p=new Float32Array(n*3);
    for(let i=0;i<n;i++){ const r=45+Math.random()*70, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
      p[i*3]=r*Math.sin(ph)*Math.cos(th); p[i*3+1]=r*Math.cos(ph); p[i*3+2]=r*Math.sin(ph)*Math.sin(th); }
    const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p,3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x9fb8d6, size:.12, transparent:true, opacity:.55, fog:false})));
  }

  /* outer data shell: fibonacci sphere + mesh lines */
  const shell = new THREE.Group(); scene.add(shell);
  {
    const N=520, R=11.5, pts=[];
    for(let i=0;i<N;i++){ const y=1-(i/(N-1))*2, r=Math.sqrt(1-y*y), th=i*2.39996323;
      pts.push(new THREE.Vector3(Math.cos(th)*r*R, y*R, Math.sin(th)*r*R)); }
    const pg = new THREE.BufferGeometry().setFromPoints(pts);
    shell.add(new THREE.Points(pg, new THREE.PointsMaterial({color:0x3ee6ff, size:.07, transparent:true, opacity:.6})));
    const seg=[];
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){ if(pts[i].distanceToSquared(pts[j])<1.75 && Math.random()<.5) seg.push(pts[i],pts[j]); }
    const lg = new THREE.BufferGeometry().setFromPoints(seg);
    shell.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({color:0x1d6f8a, transparent:true, opacity:.22})));
  }

  /* core */
  const core = new THREE.Group(); scene.add(core);
  const coreWire = new THREE.Mesh(new THREE.IcosahedronGeometry(1.7,1), new THREE.MeshBasicMaterial({color:0x3ee6ff, wireframe:true, transparent:true, opacity:.55}));
  const coreWire2 = new THREE.Mesh(new THREE.OctahedronGeometry(1.15,0), new THREE.MeshBasicMaterial({color:0x9b8cff, wireframe:true, transparent:true, opacity:.8}));
  const coreBall = new THREE.Mesh(new THREE.SphereGeometry(.62,32,32), new THREE.MeshBasicMaterial({color:0x0b4258}));
  const coreGlow = new THREE.Sprite(additive(0x3ee6ff,.9)); coreGlow.scale.set(6,6,1);
  core.add(coreWire, coreWire2, coreBall, coreGlow);
  const ringMat = new THREE.MeshBasicMaterial({color:0x3ee6ff, transparent:true, opacity:.35, side:THREE.DoubleSide});
  const ring1 = new THREE.Mesh(new THREE.RingGeometry(2.4,2.43,96), ringMat); ring1.rotation.x = Math.PI/2.3;
  const ring2 = new THREE.Mesh(new THREE.RingGeometry(2.9,2.92,96), ringMat.clone()); ring2.rotation.x = Math.PI/1.7; ring2.rotation.y=.5;
  core.add(ring1, ring2);
  const coreLabel = labelSprite('B·S', '#3ee6ff', 'root'); coreLabel.position.set(0,-2.6,0); core.add(coreLabel);

  /* section nodes */
  const orbit = new THREE.Group(); scene.add(orbit);
  const nodes = [], hits = [], pulses = [];
  const MAIN = SECTIONS.filter(s=>!s.lab).length; let mi=0, li=0; const posById={}, kids={};
  SECTIONS.forEach((s,i)=>{
    const col = hex(s.color);
    let pos;
    if(s.parent){ const pp=posById[s.parent], k=(kids[s.parent]=(kids[s.parent]||0)+1), out=pp.clone().setY(0).normalize(), tang=new THREE.Vector3(-out.z,0,out.x);
      pos = pp.clone().addScaledVector(tang, k===1?-2.3:2.3).addScaledVector(out,.8).add(new THREE.Vector3(0,-1.7,0)); }
    else if(s.lab){ const a = li/3*Math.PI*2 + .9; li++; pos = new THREE.Vector3(Math.cos(a)*10.2, 3.9, Math.sin(a)*10.2); }
    else { const a = mi/MAIN*Math.PI*2, r = 6.6 + (mi%2)*0.7; pos = new THREE.Vector3(Math.cos(a)*r, Math.sin(mi*1.9)*1.9, Math.sin(a)*r); mi++; }
    posById[s.id]=pos; const from = s.parent ? posById[s.parent] : new THREE.Vector3();
    const g = new THREE.Group(); g.position.copy(pos); orbit.add(g);

    const ball = new THREE.Mesh(new THREE.SphereGeometry(.3,24,24), new THREE.MeshBasicMaterial({color:col}));
    const shellM = new THREE.Mesh(s.lab==='hub' ? new THREE.OctahedronGeometry(.75,0) : s.parent ? new THREE.TorusKnotGeometry(.34,.09,64,8) : s.lab ? new THREE.TorusKnotGeometry(.42,.11,72,8) : new THREE.IcosahedronGeometry(.55,0), new THREE.MeshBasicMaterial({color:col, wireframe:true, transparent:true, opacity:.6}));
    const halo = new THREE.Sprite(additive(col,.75)); halo.scale.set(2.4,2.4,1);
    const label = labelSprite(s.label, s.color, s.lab==='hub' ? '◆ governance' : s.lab ? '▶ interactive' : `0x0${i+1}`); label.position.y = 1.15;
    const hit = new THREE.Mesh(new THREE.SphereGeometry(.95,12,12), new THREE.MeshBasicMaterial({visible:false}));
    hit.userData.index = i;
    g.add(ball, shellM, halo, label, hit);
    hits.push(hit);
    nodes.push({g, ball, shellM, halo, label, pos, scale:1, phase:Math.random()*6});

    // link core -> node
    const lineG = new THREE.BufferGeometry().setFromPoints([from, pos]);
    const line = new THREE.Line(lineG, new THREE.LineBasicMaterial({color:col, transparent:true, opacity:.28}));
    orbit.add(line); nodes[i].line = line;

    // data packets travelling along link
    for(let k=0;k<2;k++){
      const p = new THREE.Sprite(additive(col,.95)); p.scale.set(.35,.35,1);
      orbit.add(p); pulses.push({p, from, to:pos, t:Math.random(), speed:.18+Math.random()*.2, dir:k?1:-1});
    }
  });

  /* cross-links between neighbour nodes */
  {
    const seg=[];
    const mn = nodes.filter((_,i)=>!SECTIONS[i].lab); for(let i=0;i<mn.length;i++){ seg.push(mn[i].pos, mn[(i+1)%mn.length].pos); }
    const ln = nodes.filter((_,i)=>SECTIONS[i].lab && !SECTIONS[i].parent); for(let i=0;i<ln.length;i++){ seg.push(ln[i].pos, ln[(i+1)%ln.length].pos); }
    const cross = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(seg),
      new THREE.LineDashedMaterial({color:0x3ee6ff, transparent:true, opacity:.15, dashSize:.25, gapSize:.2}));
    cross.computeLineDistances(); orbit.add(cross);
  }

  /* interaction */
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  let hovered = -1, downAt = null;
  function pick(e){
    const r = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX-r.left)/r.width)*2-1; mouse.y = -((e.clientY-r.top)/r.height)*2+1;
    ray.setFromCamera(mouse, camera);
    const h = ray.intersectObjects(hits, false)[0];
    return h ? h.object.userData.index : -1;
  }
  canvas.addEventListener('pointermove', e=>{ hovered = pick(e); canvas.classList.toggle('pointer', hovered>=0); });
  canvas.addEventListener('pointerdown', e=>{ downAt = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', e=>{
    if(!downAt) return; const moved = Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]); downAt=null;
    if(moved > 6) return;
    const i = pick(e); if(i>=0) focusNode(i); else if(current>=0) unfocus();
  });
  canvas.addEventListener('pointerleave', ()=>{ hovered=-1; });

  /* camera flight */
  const desiredPos = HOME.clone(), desiredTarget = new THREE.Vector3();
  let flying = true;
  controls.addEventListener('start', ()=>{ flying = false; });

  const tmp = new THREE.Vector3();
  focusNode = (i) => {
    current = i; openPanel(i);
    nodes[i].g.getWorldPosition(tmp);
    desiredTarget.copy(tmp).multiplyScalar(.9);
    const out = tmp.clone().setY(0).normalize();
    desiredPos.copy(tmp).addScaledVector(out, 8).add(new THREE.Vector3(0, 2.2, 0));
    flying = true;
  };
  unfocus = () => {
    current = -1; closePanel();
    desiredPos.copy(HOME); desiredTarget.set(0,0,0); flying = true;
  };

  /* view offset so the focused node isn't hidden behind the panel */
  let ox = 0, oy = 0, W = 1, H = 1;
  function resize(){
    W = innerWidth; H = innerHeight;
    renderer.setSize(W, H, false); camera.aspect = W/H; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  /* loop */
  const clock = new THREE.Clock();
  let rotSpeed = reduce ? 0 : .07;
  function frame(){
    const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
    const k = 1 - Math.exp(-dt*2.6);

    // orbit spin pauses while focused or hovering
    const targetSpeed = (current>=0 || hovered>=0 || reduce) ? 0 : .07;
    rotSpeed += (targetSpeed - rotSpeed) * k;
    orbit.rotation.y += rotSpeed*dt;
    shell.rotation.y -= dt*.015; shell.rotation.x = Math.sin(t*.05)*.1;

    coreWire.rotation.y += dt*.25; coreWire.rotation.x += dt*.1;
    coreWire2.rotation.y -= dt*.5; coreWire2.rotation.z += dt*.2;
    ring1.rotation.z += dt*.3; ring2.rotation.z -= dt*.22;
    const beat = 1 + Math.sin(t*2.2)*.06;
    coreGlow.scale.set(6*beat, 6*beat, 1);

    nodes.forEach((n,i)=>{
      const active = i===current, hov = i===hovered;
      const target = active ? 1.25 : hov ? 1.3 : 1;
      n.scale += (target - n.scale)*k*2;
      n.g.scale.setScalar(n.scale);
      n.g.position.y = n.pos.y + Math.sin(t*.8 + n.phase)*.12;
      n.shellM.rotation.y += dt*(active?1.6:.6); n.shellM.rotation.x += dt*.3;
      n.halo.material.opacity = (active||hov ? .95 : .6) + Math.sin(t*3+n.phase)*.08;
      n.label.material.opacity = current<0 || active || hov ? .95 : .35;
      n.line.material.opacity = active ? .7 : current<0 ? .28 : .1;
    });
    pulses.forEach(q=>{
      q.t += dt*q.speed; if(q.t>1) q.t-=1;
      const f = q.dir>0 ? q.t : 1-q.t;
      q.p.position.copy(q.from).lerp(q.to, f);
    });

    if(flying){
      camera.position.lerp(desiredPos, k);
      controls.target.lerp(desiredTarget, k);
      if(camera.position.distanceTo(desiredPos) < .02) flying = false;
    }
    controls.update();

    // shift the rendered view away from the panel
    const open = current>=0, mobile = W <= 760;
    const tox = open && !mobile ? Math.min(440, W*.92)/2 : 0;
    const toy = open && mobile ? H*.17 : 0;
    ox += (tox-ox)*k*1.6; oy += (toy-oy)*k*1.6;
    if(Math.abs(ox)>.5 || Math.abs(oy)>.5) camera.setViewOffset(W, H, ox, oy, W, H);
    else camera.clearViewOffset();

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  frame();
}

const fontsReady = document.fonts ? Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]) : Promise.resolve();
fontsReady.then(()=>{
  if(!window.THREE || !THREE.OrbitControls){ document.body.classList.add('nogl'); return; }
  init3D();
  deepLink(1400);
});
</script>
</body>
</html>
